<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Misi Pengurangan - Mem Dela</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #dff9fb, #fff3b0);
  text-align: center;
  margin: 0;
  padding: 15px;
}

.game {
  max-width: 700px;
  margin: auto;
  background: white;
  padding: 25px;
  border-radius: 28px;
  box-shadow: 0 6px 20px rgba(0,0,0,.2);
}

h1 {
  color: #ff6b35;
  font-size: 32px;
  margin-bottom: 5px;
}

.identity {
  color: #555;
  line-height: 1.5;
  margin-bottom: 15px;
}

.progress {
  font-size: 20px;
  font-weight: bold;
  color: #6c5ce7;
}

.picture {
  font-size: 70px;
  margin: 15px;
  min-height: 80px;
}

.story {
  font-size: 21px;
  line-height: 1.5;
  min-height: 90px;
}

.question {
  font-size: 30px;
  font-weight: bold;
  margin: 18px;
  color: #2d3436;
}

.answer {
  display: block;
  width: 85%;
  margin: 12px auto;
  padding: 15px;
  font-size: 24px;
  border: none;
  border-radius: 18px;
  background: #74b9ff;
  color: white;
  cursor: pointer;
  box-shadow: 0 4px 0 #0984e3;
}

.answer:hover {
  transform: scale(1.03);
}

.answer:disabled {
  cursor: default;
  opacity: .8;
}

#feedback {
  font-size: 25px;
  font-weight: bold;
  min-height: 45px;
  margin: 12px;
}

#next {
  display: none;
  background: #55efc4;
  color: #145a32;
  box-shadow: 0 4px 0 #00b894;
}

.stars {
  font-size: 45px;
  margin: 10px;
}

.final-score {
  font-size: 55px;
  font-weight: bold;
  color: #ff7675;
}

.restart {
  background: #a29bfe;
  box-shadow: 0 4px 0 #6c5ce7;
}
</style>
</head>

<body>

<div class="game">

  <h1>🚀 Misi Pengurangan 🚀</h1>

  <div class="identity">
    <b>Mem Dela</b><br>
    Kelas 2<br>
    SD Negeri 71 Maluku Tengah
  </div>

  <div class="progress" id="progress">
    Soal 1 dari 10
  </div>

  <div class="picture" id="picture"></div>

  <div class="story" id="story"></div>

  <div class="question" id="question"></div>

  <div id="answers"></div>

  <div id="feedback"></div>

  <button class="answer" id="next" onclick="nextQuestion()">
    ➡️ Soal Berikutnya
  </button>

</div>


<script>

let current = 0;
let score = 0;
let answered = false;

function loadQuestion() {

  let q = questions[current];

  document.getElementById("progress").innerText =
    "Soal " + (current + 1) + " dari " + questions.length;

  document.getElementById("picture").innerText =
    q.picture;

  document.getElementById("story").innerText =
    q.story;

  document.getElementById("question").innerText =
    q.question;

  document.getElementById("feedback").innerText = "";

  document.getElementById("next").style.display = "none";

  answered = false;

  let box = document.getElementById("answers");

  box.innerHTML = "";

  for (let i = 0; i < q.answers.length; i++) {

    let button = document.createElement("button");

    button.className = "answer";

    button.innerText = q.answers[i];

    button.onclick = function() {
      checkAnswer(q.answers[i]);
    };

    box.appendChild(button);
  }
}


function speak(text) {

  if ("speechSynthesis" in window) {

    let suara = new SpeechSynthesisUtterance(text);

    suara.lang = "id-ID";
    suara.rate = 0.9;

    speechSynthesis.cancel();
    speechSynthesis.speak(suara);
  }
}


function checkAnswer(answer) {

  if (answered) {
    return;
  }

  let q = questions[current];

  if (answer == q.correct) {

    answered = true;

    score = score + 1;

    document.getElementById("feedback").innerText =
      "🎉 Hebat! Jawabanmu benar! ⭐";

    speak("Hebat! Jawabanmu benar!");

    document.getElementById("next").style.display =
      "block";

    let buttons =
      document.querySelectorAll("#answers button");

    buttons.forEach(function(button) {
      button.disabled = true;
    });

  } else {

    document.getElementById("feedback").innerText =
      "🌸 Belum tepat. Coba lagi!";

    speak("Belum tepat. Coba lagi!");
  }
}


function nextQuestion() {

  current = current + 1;

  if (current < questions.length) {

    loadQuestion();

  } else {

    showResult();
  }
}


function showResult() {

  let pesan = "";

  if (score == 10) {

    pesan = "🌟 Luar biasa! Semua benar!";

  } else if (score >= 8) {

    pesan = "🎉 Hebat sekali!";

  } else if (score >= 6) {

    pesan = "👏 Bagus! Ayo latihan lagi!";

  } else {

    pesan = "💪 Tetap semangat! Kamu pasti bisa!";
  }


  document.querySelector(".game").innerHTML =

    "<h1>🏆 Misi Selesai! 🏆</h1>" +

    "<div class='identity'>" +
    "<b>Mem Dela</b><br>" +
    "Kelas 2<br>" +
    "SD Negeri 71 Maluku Tengah" +
    "</div>" +

    "<div class='stars'>⭐⭐⭐⭐⭐</div>" +

    "<p style='font-size:25px;'>Skormu</p>" +

    "<div class='final-score'>" +
    score + " / 10" +
    "</div>" +

    "<p style='font-size:24px;'>" +
    pesan +
    "</p>" +

    "<button class='answer restart' " +
    "onclick='location.reload()'>" +
    "🔄 Main Lagi" +
    "</button>";

  speak(
    "Permainan selesai. Skormu " +
    score +
    " dari 10."
  );
}


loadQuestion();

</script>

</body>
</html>
